<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- The site moved to Vercel. This copy only sends visitors (and Google) there. -->

    <link rel="canonical" href="https://caratcloud.in/" />

      var p = location.pathname.replace(/^\/caratcloudstorefront/, "") || "/";

  </head>
  <body>
    <p>CaratCloud has moved to <a href="https://caratcloud.in/">caratcloud.in</a>.</p>
  </body>
