<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- The site moved to Vercel. This copy only sends visitors (and Google) there. -->
    <title>CaratCloud has moved</title>
    <meta name="robots" content="noindex, follow" />
    <link rel="canonical" href="https://caratcloudstorefront.vercel.app/" />
    <meta http-equiv="refresh" content="0; url=https://caratcloudstorefront.vercel.app/" />
    <script>
      var p = location.pathname.replace(/^\/caratcloudstorefront/, "") || "/";
      location.replace("https://caratcloudstorefront.vercel.app" + p + location.search + location.hash);
    </script>
  </head>
  <body>
    <p>CaratCloud has moved to <a href="https://caratcloudstorefront.vercel.app/">caratcloudstorefront.vercel.app</a>.</p>
  </body>
</html>
